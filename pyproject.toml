[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aixm"
version = "1.1.1"
description = "Python 工具包"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "zxh"}
]
keywords = ["utils", "tools", "utilities", "redis", "zrpc"]
dependencies = [
    "redis>=4.2.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/zxh1993/aixm_part"
Repository = "https://github.com/zxh1993/aixm_part.git"
Issues = "https://github.com/zxh1993/aixm_part/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aixm*"]
exclude = ["test*"]
namespaces = false

[tool.setuptools.package-dir]
"" = "src"
